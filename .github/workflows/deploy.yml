name: Deploy infrastructure

# CI/CD for the EPIC (dna-predict) AWS infrastructure.
#
# - Pull requests: build + `cdk synth` only (validation, no AWS changes).
# - Push to main:  build + `cdk deploy` to the target account via GitHub OIDC.
#
# No long-lived AWS keys: the deploy job assumes an existing IAM role through
# OIDC (the GitHub <> AWS connection is assumed to already exist). Configure:
#   Secret:   AWS_ROLE_ARN  — ARN of the role GitHub Actions assumes
#   Variable: AWS_REGION    — target region (defaults to eu-central-1 if unset)
# The account id is derived from the assumed role, so no AWS_ACCOUNT_ID needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: only the deploy job requests id-token (OIDC).
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build & synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npx cdk synth
        env:
          # Synth doesn't need credentials; region only affects context.
          CDK_DEPLOY_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    # Only from main, never on PRs from forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment: production
    permissions:
      contents: read
      id-token: write # required for OIDC
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      # The epic image is built for linux/arm64 (Graviton). The runner is
      # x86_64, so register QEMU to emulate arm64 during the Docker build.
      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
          role-session-name: gha-dna-predict-deploy

      - run: npm ci
      - run: npm run build

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
        env:
          # Account is taken from the assumed-role identity (CDK_DEFAULT_ACCOUNT,
          # set by configure-aws-credentials); region from the variable.
          CDK_DEPLOY_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
