name: CDK bootstrap

# One-time (or occasional) CDK bootstrap of the target account/region.
# Triggered manually from the Actions tab. Uses the same OIDC deploy role and
# secrets as the deploy workflow.
#
# Configure:
#   Secret:   AWS_ROLE_ARN — ARN of the role GitHub Actions assumes
#   Variable: AWS_REGION   — target region (defaults to eu-central-1)
# The account id is derived from the assumed role via STS.
#
# The role must be permitted to create the CDK bootstrap resources
# (CloudFormation "CDKToolkit" stack, the cdk-* roles, the assets bucket/ECR).

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region to bootstrap (defaults to the AWS_REGION variable)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: cdk bootstrap
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required for OIDC
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Check required secret
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::error::secret AWS_ROLE_ARN is empty or not set. Add it in repo/environment secrets (see infra/README.md)."
            exit 1
          fi

      - name: Resolve region
        id: region
        run: echo "value=${{ inputs.region != '' && inputs.region || vars.AWS_REGION || 'eu-central-1' }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.region.outputs.value }}
          role-session-name: gha-dna-predict-bootstrap

      - run: npm ci

      - name: CDK bootstrap
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "Bootstrapping aws://${ACCOUNT_ID}/${{ steps.region.outputs.value }}"
          npx cdk bootstrap "aws://${ACCOUNT_ID}/${{ steps.region.outputs.value }}"
        env:
          CDK_DEPLOY_REGION: ${{ steps.region.outputs.value }}
